<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#0c0820"/>
    </linearGradient>
    <linearGradient id="vgrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="url(#vgrad)" stroke-width="1.5" opacity="0.45"/>
  <!-- Subtle violet glow blob -->
  <circle cx="50" cy="48" r="28" fill="hsl(258 88% 66% / 0.08)"/>
  <!-- Y letter -->
  <text x="50" y="65" font-family="Arial Black, Arial" font-weight="900" font-size="52"
        fill="url(#vgrad)" text-anchor="middle" filter="url(#glow)">Y</text>
  <!-- Gold bar -->
  <rect x="16" y="72" width="68" height="3" rx="2" fill="url(#gold)" opacity="0.9"/>
  <!-- BET text -->
  <text x="50" y="90" font-family="Arial Black, Arial" font-weight="900" font-size="10.5"
        fill="#fbbf24" text-anchor="middle" letter-spacing="4.5" opacity="0.95">BET</text>
</svg>
