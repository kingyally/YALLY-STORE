<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#0a1628"/>
  <rect width="100" height="100" rx="22" fill="url(#grad)" opacity="0.9"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#071423"/>
    </linearGradient>
  </defs>
  <!-- Y letter -->
  <text x="50" y="62" font-family="Arial Black, Arial" font-weight="900" font-size="48" fill="#10B981" text-anchor="middle" letter-spacing="-2">Y</text>
  <!-- Emerald glow bar -->
  <rect x="20" y="72" width="60" height="3" rx="2" fill="#10B981" opacity="0.6"/>
  <!-- Small text -->
  <text x="50" y="88" font-family="Arial" font-weight="700" font-size="10" fill="#10B981" text-anchor="middle" letter-spacing="2" opacity="0.8">BET</text>
</svg>
